<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <link rel="stylesheet" href="xterm.css"/>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #0b1220; overflow: hidden; }
    #term { position: absolute; inset: 0; }
    .xterm { height: 100%; }
    .xterm-viewport { overflow-y: auto !important; }
  </style>
</head>
<body>
  <div id="term"></div>
  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'bar',
      fontFamily: 'Menlo, Consolas, "Droid Sans Mono", monospace',
      fontSize: 15,
      lineHeight: 1.15,
      scrollback: 8000,
      theme: {
        background: '#0b1220',
        foreground: '#d7e0ea',
        cursor: '#3ddcff',
        cursorAccent: '#0b1220',
        selectionBackground: '#3d5aa888',
        black: '#0b1220',
        red: '#ff6b6b',
        green: '#7cdbb6',
        yellow: '#e6c07b',
        blue: '#61afef',
        magenta: '#c678dd',
        cyan: '#3ddcff',
        white: '#d7e0ea',
        brightBlack: '#5c6773',
        brightRed: '#ff8787',
        brightGreen: '#98e6c8',
        brightYellow: '#f0d48a',
        brightBlue: '#8fc7f5',
        brightMagenta: '#d7a1e8',
        brightCyan: '#7aebff',
        brightWhite: '#ffffff'
      }
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('term'));
    function doFit() {
      try { fit.fit(); } catch (e) {}
      try { if (window.SshPad) SshPad.onResize(term.cols, term.rows); } catch (e) {}
    }
    setTimeout(doFit, 30);
    window.addEventListener('resize', doFit);
    term.onData(function (d) {
      try { if (window.SshPad) SshPad.onData(d); } catch (e) {}
    });
    window.__apply = function (dark, size) {
      const ghDark = {
        background: '#0d1117', foreground: '#e6edf3', cursor: '#58a6ff', cursorAccent: '#0d1117',
        selectionBackground: '#1f6feb66',
        black: '#484f58', red: '#ff7b72', green: '#3fb950', yellow: '#d29922',
        blue: '#58a6ff', magenta: '#bc8cff', cyan: '#39d353', white: '#b1bac4',
        brightBlack: '#6e7681', brightRed: '#ffa198', brightGreen: '#56d364', brightYellow: '#e3b341',
        brightBlue: '#79c0ff', brightMagenta: '#d2a8ff', brightCyan: '#56d364', brightWhite: '#f0f6fc'
      };
      const ghLight = {
        background: '#ffffff', foreground: '#1f2328', cursor: '#0969da', cursorAccent: '#ffffff',
        selectionBackground: '#0969da33',
        black: '#24292f', red: '#cf222e', green: '#1a7f37', yellow: '#9a6700',
        blue: '#0969da', magenta: '#8250df', cyan: '#1b7c83', white: '#6e7781',
        brightBlack: '#656d76', brightRed: '#fa4549', brightGreen: '#2da44e', brightYellow: '#bf8700',
        brightBlue: '#218bff', brightMagenta: '#a475f9', brightCyan: '#3192aa', brightWhite: '#1f2328'
      };
      const t = dark ? ghDark : ghLight;
      try { term.options.theme = t; } catch (e) {}
      try { term.options.fontSize = size; } catch (e) {}
      document.body.style.background = t.background;
      document.documentElement.style.background = t.background;
      doFit();
    };
    window.__writeB64 = function (b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      term.write(arr);
    };
    window.__fit = doFit;
    window.__focus = function () { term.focus(); };
    window.__reset = function () { term.reset(); doFit(); };
    document.addEventListener('click', function () { term.focus(); });
    document.addEventListener('touchend', function () { term.focus(); });
  </script>
</body>
</html>
